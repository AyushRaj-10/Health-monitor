version: '3.8'

networks:
  iomt_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: iomt-postgres
    restart: unless-stopped
    networks:
      - iomt_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iomt_rpm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iomt_rpm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis In-Memory Cache & BullMQ Queue Store
  redis:
    image: redis:7-alpine
    container_name: iomt-redis
    restart: unless-stopped
    networks:
      - iomt_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Central Node.js / Express Backend API & Socket.IO Telemetry Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iomt-backend
    restart: unless-stopped
    networks:
      - iomt_network
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iomt_rpm}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-academic-rpm-access-secret-2026-secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-academic-rpm-refresh-secret-2026-secure}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      DATA_AT_REST_KEY: ${DATA_AT_REST_KEY:-32_byte_hex_production_key_0123456789abcdef0123456789abcdef}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 4. React Vite SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iomt-frontend
    restart: unless-stopped
    networks:
      - iomt_network
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 5. IoMT Edge Telemetry Simulator & Differential Privacy Gateway
  edge-simulator:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: iomt-edge-simulator
    restart: unless-stopped
    networks:
      - iomt_network
    environment:
      EDGE_PORT: 5005
      BACKEND_URL: http://backend:5001/api
      NODE_ENV: production
    ports:
      - "5005:5005"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
